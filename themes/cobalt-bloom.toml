name = "Cobalt Bloom"
brightness = "light"

# Ink-blue, violet and teal keep this cool slate canvas energetic.
[colors]
background = "#E1E8F0"
surface = "#EDF3F8"
surface_variant = "#CBD8E5"
primary = "#0057B8"
on_primary = "#FFFFFF"
secondary = "#6B3FA0"
on_secondary = "#FFFFFF"
accent = "#007C91"
error = "#C1264F"
on_error = "#FFFFFF"
warning = "#9A6200"
on_warning = "#FFFFFF"
success = "#00785A"
on_success = "#FFFFFF"
info = "#0057B8"
text = "#172B42"
text_muted = "#52677C"
border = "#9EB2C6"
border_active = "#0057B8"
border_subtle = "#C2D0DE"
selection = "#0057B8"
selected_text = "#FFFFFF"
assistant = "#6B3FA0"
diff_added = "#00785A"
diff_removed = "#C1264F"
diff_added_bg = "#D6ECE4"
diff_removed_bg = "#F4DCE4"

