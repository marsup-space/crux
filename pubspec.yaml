name: crux
description: A terminal-based AI coding agent with agentic orchestration.
version: 0.50.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  nocterm:
    path: nocterm
  dart_jieba:
    path: dart-jieba
  textmate_highlight:
    path: textmate_highlight
  semble_dart:
    path: semble-dart
  markdown: ^7.2.0
  dart_markdown: ^3.1.7
  source_span: ^1.10.0
  characters: ^1.3.0
  path: ^1.9.0
  glob: ^2.1.3
  toml: ^0.18.0
  yaml: ^3.1.2
  drift: ^2.22.1
  sqlite3: ^2.7.4
  json_annotation: ^4.9.0
  crypto: ^3.0.3
  ffi: ^2.1.4
  bloc: ^9.2.1
  nocterm_bloc: ^1.1.0

  meta: any
dev_dependencies:
  archive: ^4.0.9
  lints: ^6.0.0
  test: ^1.31.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  bloc_test: ^10.0.0

dependency_overrides:
  nocterm:
    path: nocterm
  dart_markdown:
    path: third_party/dart_markdown
