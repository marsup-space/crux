name: Release Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        default: linux-x64
        type: choice
        options:
          - linux-x64
          - linux-arm64

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'linux-x64' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'linux-x64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'linux-x64' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache third-party tools
        uses: actions/cache@v4
        with:
          path: third_party/bin
          key: ${{ runner.os }}-third-party-${{ hashFiles('third_party/manifest.toml', 'third_party/manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-third-party-

      - name: Install dependencies
        run: dart pub get

      - name: Build release bundle
        run: dart run tool/build_release.dart --target "$TARGET"

      - name: Pack release bundle
        run: |
          cd build/releases
          tar -czf "crux-$TARGET.tar.gz" "crux-$TARGET"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: crux-${{ env.TARGET }}
          path: build/releases/crux-${{ env.TARGET }}.tar.gz
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Crux ${{ github.ref_name }}
          files: build/releases/crux-${{ env.TARGET }}.tar.gz
