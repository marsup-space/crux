name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x64
          - linux-arm64
          - macos-x64
          - macos-arm64
          - windows-x64
      publish_tag:
        description: Optional existing tag to publish assets to, e.g. v0.7.0
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-x64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-latest
          - target: windows-x64
            os: windows-latest
    env:
      TARGET: ${{ matrix.target }}
      SHOULD_BUILD: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.target }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.publish_tag }}

    steps:
      - name: Check out repository
        if: env.SHOULD_BUILD == 'true'
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Dart
        if: env.SHOULD_BUILD == 'true'
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: stable

      - name: Cache pub packages
        if: env.SHOULD_BUILD == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache third-party tools
        if: env.SHOULD_BUILD == 'true'
        uses: actions/cache@v5
        with:
          path: third_party/bin
          key: ${{ runner.os }}-third-party-${{ hashFiles('third_party/manifest.toml', 'third_party/manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-third-party-

      - name: Install dependencies
        if: env.SHOULD_BUILD == 'true'
        run: dart pub get

      # `tool/build_native.dart` (used in the pre-step below)
      # imports `package:crypto` and `package:path` from the
      # submodule's own pub workspace, so the submodule needs
      # its own `pub get` — the root-level `dart pub get`
      # above doesn't resolve a sibling package's deps.
      - name: Install submodule dependencies
        if: env.SHOULD_BUILD == 'true'
        run: |
          cd semble-dart
          dart pub get

      # Build `libcrux_grammars.<ext>` for the target on the CI
      # runner before the main release build runs. The dylib
      # only ships prebuilt in the submodule for macos-arm64
      # (so developer `release.sh` on Apple Silicon Just Works).
      # Every other target has to compile it from source as
      # part of the release pipeline.
      #
      # Skipped on windows-x64 — the build_native tool needs
      # `cl.exe` and Visual Studio's MSVC toolchain, which
      # `windows-latest` runners don't ship. The Windows
      # release currently ships without `libcrux_grammars.dll`,
      # so the bundled Crux on Windows can't run
      # `semantic_search` / `find_similar_code` — every other
      # tool works. TODO: build the dylib in a Windows-friendly
      # way (cross-compile from linux, or add a windows-latest
      # step that sets up cl.exe).
      - name: Build libcrux_grammars (POSIX)
        if: env.SHOULD_BUILD == 'true' && matrix.target != 'windows-x64'
        run: |
          cd semble-dart
          dart run tool/build_native.dart --target "$TARGET"
        shell: bash

      - name: Build release bundle
        if: env.SHOULD_BUILD == 'true'
        run: dart run tool/build_release.dart --target "$TARGET"
        shell: bash

      - name: Pack release bundle
        if: env.SHOULD_BUILD == 'true'
        run: python -c "import shutil; shutil.make_archive('build/releases/crux-${{ env.TARGET }}', 'zip', 'build/releases', 'crux-${{ env.TARGET }}')"

      - name: Upload release artifact
        if: env.SHOULD_BUILD == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: crux-${{ env.TARGET }}
          path: build/releases/crux-${{ env.TARGET }}.zip
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG
        if: env.SHOULD_BUILD == 'true' && env.RELEASE_TAG != ''
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p build
          awk -v ver="$VERSION" '
            /^## \[/ {
              expected = "## [" ver "]"
              if (substr($0, 1, length(expected)) == expected) { flag = 1 }
              else { flag = 0 }
            }
            flag { print }
          ' CHANGELOG.md > build/release-notes.md
          if [ ! -s build/release-notes.md ]; then
            echo "::warning::No CHANGELOG section found for $RELEASE_TAG; release body will be empty."
          fi
          echo "--- Release notes for $RELEASE_TAG ---"
          cat build/release-notes.md

      - name: Publish GitHub Release
        if: env.SHOULD_BUILD == 'true' && env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Crux ${{ env.RELEASE_TAG }}
          files: build/releases/crux-${{ env.TARGET }}.zip
          body_path: build/release-notes.md
          overwrite_files: true
