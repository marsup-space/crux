name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x64
          - macos-arm64
          - windows-x64
      publish_tag:
        description: Optional existing tag to publish assets to, e.g. v0.7.0
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: macos-arm64
            os: macos-latest
          - target: windows-x64
            os: windows-latest
    env:
      TARGET: ${{ matrix.target }}
      SHOULD_BUILD: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == matrix.target }}
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.publish_tag }}

    steps:
      - name: Check out repository
        if: env.SHOULD_BUILD == 'true'
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Dart
        if: env.SHOULD_BUILD == 'true'
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: 3.13

      - name: Set up MinGW-w64 for Semble
        if: env.SHOULD_BUILD == 'true' && matrix.target == 'windows-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # tree-sitter v0.26's Unicode implementation includes ICU headers
          # on Windows; install the UCRT64 headers/libraries alongside GCC.
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-icu
          path-type: inherit

      - name: Cache pub packages
        if: env.SHOULD_BUILD == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache third-party tools
        if: env.SHOULD_BUILD == 'true'
        uses: actions/cache@v5
        with:
          path: third_party/bin
          key: ${{ runner.os }}-third-party-${{ hashFiles('third_party/manifest.toml', 'third_party/manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-third-party-

      - name: Install dependencies
        if: env.SHOULD_BUILD == 'true'
        run: dart pub get

      # `tool/build_native.dart` (used in the pre-step below)
      # imports `package:crypto` and `package:path` from the
      # submodule's own pub workspace, so the submodule needs
      # its own `pub get` — the root-level `dart pub get`
      # above doesn't resolve a sibling package's deps.
      - name: Install submodule dependencies
        if: env.SHOULD_BUILD == 'true'
        run: |
          cd semble-dart
          dart pub get

      # Build `libcrux_grammars.<ext>` for the target on the CI
      # runner before the main release build runs. The dylib
      # only ships prebuilt in the submodule for macos-arm64
      # (so developer `release.sh` on Apple Silicon Just Works).
      # Every other target has to compile it from source as
      # part of the release pipeline.
      #
      - name: Build libcrux_grammars (POSIX)
        if: env.SHOULD_BUILD == 'true' && matrix.target != 'windows-x64'
        env:
          # `build_native.dart` defaults to SSH git URLs for tree-sitter
          # + grammar clones (works behind GFW-friendly networks when the
          # developer has a GitHub SSH key). CI runners have no SSH key,
          # so force HTTPS — the grammar repos are all public, no auth
          # needed.
          SEMBLE_GIT_HTTPS: '1'
        run: |
          cd semble-dart
          # `dart run` does NOT propagate the Dart script's exit
          # code (it returns 0 even when main() returns 1), so we
          # can't trust the step's green-check icon — verify the
          # dylib exists instead. The dylib is what
          # `build_release.dart` actually needs; the script's exit
          # code is decorative.
          dart run tool/build_native.dart --target "$TARGET"
          # Extension is target-dependent (.dylib on macOS, .so on
          # Linux). The script prints e.g. "→ cc -shared -o
          # third_party/bin/linux-arm64/libcrux_grammars.so" — we
          # pick up whatever it produced.
          dylib="$(ls "third_party/bin/${TARGET}"/libcrux_grammars.* 2>/dev/null | head -1)"
          if [ -z "$dylib" ]; then
            echo "::error::libcrux_grammars build produced no dylib under third_party/bin/${TARGET}/"
            ls -la "third_party/bin/${TARGET}/" 2>/dev/null || echo "  (directory does not exist)"
            exit 1
          fi
          echo "libcrux_grammars: built $dylib"
        shell: bash

      - name: Build libcrux_grammars (Windows)
        if: env.SHOULD_BUILD == 'true' && matrix.target == 'windows-x64'
        env:
          SEMBLE_GIT_HTTPS: '1'
        shell: msys2 {0}
        run: |
          cd semble-dart
          dart run tool/build_native.dart --target "$TARGET"
          test -f "third_party/bin/${TARGET}/libcrux_grammars.dll"

      # CI runners start with an empty HuggingFace cache, and
      # `build_release.dart` only warns when the embedding model is
      # missing — without this step the published bundle silently
      # ships without the semantic-search model. Download
      # `minishlab/potion-code-16M` before building (all 5 matrix
      # targets need it). Cached by model name across runs; bump the
      # key suffix to force a re-fetch.
      - name: Cache embedding model
        if: env.SHOULD_BUILD == 'true'
        id: cache-semble-model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          # v1 was poisoned by a Windows run that crashed mid-download
          # (charmap error) but still saved its partial cache — a hit
          # then skipped the download while refs/main pointed at an
          # incomplete snapshot. v2 forces a clean re-fetch everywhere.
          key: ${{ runner.os }}-hf-minishlab-potion-code-16M-v2

      - name: Download embedding model (potion-code-16M)
        if: env.SHOULD_BUILD == 'true' && steps.cache-semble-model.outputs.cache-hit != 'true'
        env:
          # huggingface_hub prints a Unicode ✓ on completion; without
          # UTF-8 mode Python on Windows runners crashes with a
          # 'charmap' codec encode error at the very end of the download.
          PYTHONUTF8: '1'
        run: |
          python -m pip install --quiet --upgrade huggingface_hub
          # Newer huggingface_hub exposes `hf`; older releases only
          # ship `huggingface-cli`. Both write to the same default
          # cache layout ($HOME/.cache/huggingface/hub) that
          # `build_release.dart` reads.
          if command -v hf >/dev/null 2>&1; then
            hf download minishlab/potion-code-16M
          else
            huggingface-cli download minishlab/potion-code-16M
          fi
          # `build_release.dart` treats a missing snapshot ref as a
          # warning — fail loudly here instead so a broken download
          # can never reach the Publish step.
          ref="$HOME/.cache/huggingface/hub/models--minishlab--potion-code-16M/refs/main"
          if [ ! -s "$ref" ]; then
            echo "::error::potion-code-16M download did not create $ref"
            exit 1
          fi
          snap="$(cat "$ref")"
          snapdir="$HOME/.cache/huggingface/hub/models--minishlab--potion-code-16M/snapshots/$snap"
          for f in model.safetensors tokenizer.json; do
            if [ ! -f "$snapdir/$f" ]; then
              echo "::error::potion-code-16M snapshot incomplete: missing $snapdir/$f"
              exit 1
            fi
          done
          echo "potion-code-16M snapshot: $snap"
        shell: bash

      # Stage the model into a plain directory of REAL files (cp -L
      # dereferences the HF cache's symlinks) and hand it to the build
      # via CRUX_SEMBLE_MODEL_DIR. Runs even on cache hits, and avoids
      # Windows snapshot-symlink semantics tripping Dart's File.copy.
      - name: Stage embedding model for bundling
        if: env.SHOULD_BUILD == 'true'
        run: |
          ref="$HOME/.cache/huggingface/hub/models--minishlab--potion-code-16M/refs/main"
          snap="$(cat "$ref")"
          snapdir="$HOME/.cache/huggingface/hub/models--minishlab--potion-code-16M/snapshots/$snap"
          mkdir -p build/semblemodel
          cp -L "$snapdir/model.safetensors" "$snapdir/tokenizer.json" build/semblemodel/
          echo "CRUX_SEMBLE_MODEL_DIR=$PWD/build/semblemodel" >> "$GITHUB_ENV"
          ls -la build/semblemodel
        shell: bash

      # Same `dart run` exit-code caveat as the grammars step above:
      # `build_release.dart` calls exit(1) when the bundle is broken,
      # but the step would still report success — verify the bundle
      # contents explicitly instead of trusting the green check.
      - name: Build release bundle
        if: env.SHOULD_BUILD == 'true'
        run: |
          dart run tool/build_release.dart --target "$TARGET"
          bundle="build/releases/crux-${TARGET}"
          exe="$bundle/bin/crux"
          if [ "$TARGET" = "windows-x64" ]; then exe="$bundle/bin/crux.exe"; fi
          if [ ! -f "$exe" ]; then
            echo "::error::release build produced no executable at $exe"
            ls -la "$bundle" 2>/dev/null || echo "  (bundle directory does not exist)"
            exit 1
          fi
          # The bundle must ship the semantic-search model — the build
          # only warns when it's absent (see the download step above).
          for f in model.safetensors tokenizer.json; do
            if [ ! -f "$bundle/third_party/semblemodel/$f" ]; then
              echo "::error::bundle is missing third_party/semblemodel/$f"
              exit 1
            fi
          done
          echo "release bundle: $exe + third_party/semblemodel OK"
        shell: bash

      - name: Pack release bundle
        if: env.SHOULD_BUILD == 'true'
        run: python -c "import shutil; shutil.make_archive('build/releases/crux-${{ env.TARGET }}', 'zip', 'build/releases', 'crux-${{ env.TARGET }}')"

      - name: Upload release artifact
        if: env.SHOULD_BUILD == 'true'
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: crux-${{ env.TARGET }}
          path: build/releases/crux-${{ env.TARGET }}.zip
          if-no-files-found: error
          # The zip is already attached to the GitHub Release below
          # (softprops/action-gh-release), so the CI artifact is a pure
          # transient — the default 90-day retention is far too long.
          # 5 days gives a retry window if the release publish fails,
          # while keeping Actions storage from filling up.
          #
          # `continue-on-error: true` so a GitHub Actions storage-quota
          # hit (free-tier caps the repo at 2 GB and the usage tracker
          # only recalculates every 6-12 h) doesn't block the actual
          # GitHub Release publish below. The CI artifact is purely
          # transient — the durable asset is the GitHub Release zip
          # uploaded by softprops/action-gh-release in the next step.
          retention-days: 5

      - name: Extract release notes from CHANGELOG
        if: env.SHOULD_BUILD == 'true' && env.RELEASE_TAG != ''
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p build
          awk -v ver="$VERSION" '
            /^## \[/ {
              expected = "## [" ver "]"
              if (substr($0, 1, length(expected)) == expected) { flag = 1 }
              else { flag = 0 }
            }
            flag { print }
          ' CHANGELOG.md > build/release-notes.md
          if [ ! -s build/release-notes.md ]; then
            echo "::warning::No CHANGELOG section found for $RELEASE_TAG; release body will be empty."
          fi
          echo "--- Release notes for $RELEASE_TAG ---"
          cat build/release-notes.md

      - name: Publish GitHub Release
        if: env.SHOULD_BUILD == 'true' && env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Crux ${{ env.RELEASE_TAG }}
          files: build/releases/crux-${{ env.TARGET }}.zip
          body_path: build/release-notes.md
          overwrite_files: true
