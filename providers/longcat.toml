# LongCat provider configuration
# Filename serves as the provider name: "longcat"
# OpenAI-format endpoint: https://api.longcat.chat/openai/v1
# (Crux appends /chat/completions to the base URL
#  → https://api.longcat.chat/openai/v1/chat/completions)
#
# Uses the generic `type = "openai_compatible"` — no custom type
# registration needed in llm_provider.dart. LongCat also offers an
# Anthropic-format endpoint at /anthropic/v1/messages, but that path
# uses Bearer auth (not Anthropic's x-api-key) so the generic
# anthropic_compatible type doesn't fit; a future built-in that
# wants the Anthropic shape would need a new resolveProvider() case
# (see how `minimax` is registered). The OpenAI endpoint uses Bearer
# too, so the generic shape works as-is.

type = "openai_compatible"
endpoint_url = "https://api.longcat.chat/openai/v1"

# LongCat's thinking phase can run for several minutes between
# content chunks (the whole pass lands as one big thinking block at
# the end). Raise both stream watchdogs so a quiet-but-alive stream
# doesn't trip the 120 s idle default. `null`/absent would keep the
# defaults (120 s idle / 10 min max) — see LlmClient.streamChat.
# Doubled from the previous 10 min idle / 30 min max — LongCat's
# 1.6T-param MoE can sit quietly on long reasoning passes for
# well over 10 min on a busy upstream.
stream_idle_timeout_ms = 1200000   # 20 min between chunks
stream_max_duration_ms = 3600000  # 60 min total

[[models]]
id = "LongCat-2.0"
name = "LongCat 2.0"
context_size = 1048576
image_support = false
max_tokens = 131072
thinking = true
thinking_budget = 10000
# Expose the full reasoning-effort picker so LongCat receives the
# standard OpenAI `reasoning_effort` field on every request. The
# openai_compatible provider's mapEffort sends:
#
#   off    → thinking.type = "disabled"
#   low    → "low"
#   normal → "high"
#   high   → "high"
#   max    → "max"
#
# LongCat's docs don't document the field, but the proxy already
# advertises `thinking` in its supported_parameters, and
# reasoning_effort is standard OpenAI shape — it may honour the
# field or silently ignore it. Either way, zero downside to
# sending it.
reasoning_effort = "normal"
temperature = 0
stream_lerp = true
