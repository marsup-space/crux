# ChatGPT Codex provider configuration.
#
# This targets the same ChatGPT backend used by the Codex CLI and OpenCode's
# Codex auth plugin. It is intentionally not the public OpenAI API endpoint:
# Crux sends Responses API requests to `/backend-api/codex/responses` and
# attaches Codex-specific originator/session headers.
#
# Authentication: sign in with a device code:
#
#   /provider codex login
#
# Crux opens the verification page and stores the OAuth credential in its
# protected auth file. An externally managed token can still be supplied via
# `CRUX_API_KEY_CODEX`.
type = "codex"
endpoint_url = "https://chatgpt.com/backend-api/codex"

[[models]]
id = "gpt-6-astra"
name = "GPT-6 Astra"
context_size = 256000
image_support = true
max_tokens = 128000
thinking = true
reasoning_effort = "high"
temperature = 0
stream_lerp = true

