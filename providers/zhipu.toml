# Zhipu (GLM Coding Plan) provider configuration
# Filename serves as the provider name: "zhipu"
# OpenAI-compatible Coding Plan API:
#   https://open.bigmodel.cn/api/coding/paas/v4
# Anthropic-compatible Coding Plan API (not used by Crux yet):
#   https://open.bigmodel.cn/api/anthropic
#
# The custom `type = "zhipu"` value is registered in
# `llm_provider.dart`'s resolveProvider() — it dispatches to a
# Zhipu-specific LlmProvider that:
#   - extends OpenAICompatibleProvider (OpenAI Chat Completions
#     wire shape, Bearer auth, stream parsing inherited);
#   - mixes in CodingPlanProvider so the toolbar can display
#     live quota from `<origin>/api/monitor/usage/quota/limit`;
#   - renames `max_completion_tokens` → `max_tokens` on the
#     wire, matching the only field name shown in the Zhipu
#     cURL / Python / Java SDK examples (see
#     providers/zhipu_provider.dart's class doc for the full
#     rationale).
#
# Models
# ------
# Per https://docs.bigmodel.cn/cn/coding-plan/overview, the GLM
# Coding Plan is open to all tiers (Lite / Pro / Max) and
# currently serves exactly two models:
#
#   * GLM-5.3        — 1M context, 128K out (flagship, text-only)
#   * GLM-5.3-Flash  — 1M context, multimodal (image input),
#                      always-on thinking, ~1/3 the credit cost
#                      of GLM-5.3
#
# Legacy models are gone from the plan: per the same page,
# calling GLM-5.2 or GLM-5.1 is auto-redirected to GLM-5.3,
# and calling GLM-5-Turbo or GLM-4.7 is auto-redirected to
# GLM-5.3-Flash (GLM-4.5-Air is no longer mentioned at all).
# Since upstream silently rewrites the model anyway, Crux lists
# only the two real targets — no point showing IDs the plan no
# longer serves.
#
# Model IDs on the wire are lowercase + dot-separated
# (`glm-5.3`, `glm-5.3-flash`) — every authoritative
# wire-format reference uses lowercase, even though the
# marketing names are mixed case. Crux passes the TOML `id`
# field through verbatim, so the `id` here is the canonical ID.
#
# GLM-5.3 is text-only (no image input). GLM-5.3-Flash is
# natively multimodal — the official switching guide
# (https://docs.bigmodel.cn/cn/coding-plan/latest-model)
# explicitly says to enable "Support Images" for it — so
# `image_support = true` on the Flash entry.
#
# Stream lerping
# --------------
# Like MiniMax, Kimi, and LongCat, Zhipu's GLM models stream
# in fine-grained chunks and benefit from `stream_lerp = true`
# (60Hz timer that drains the pending buffer at a steady
# rate). The flag is set on every model entry.
#
# Temperature
# -----------
# The Zhipu cURL / SDK examples all use `temperature: 1.0`,
# but the docs do not pin the value (unlike Kimi, which
# hard-400s on anything other than 1.0). Crux's coding
# default is `temperature = 0.0`; the `/temperature` slash
# command clamps to `[0.0, 1.0]`. Both are honored by the
# Zhipu API. The `temperature` field is set to `0` on every
# model below for the deterministic-coding default.
#
# Reasoning effort
# ----------------
# The Zhipu cURL examples send `reasoning_effort: "max"`. The
# upstream's `thinking.type: "enabled"` flips the model into
# extended thinking mode; `reasoning_effort` controls depth.
# The generic OpenAI-compatible builder already maps Crux's
# `max` → wire `max`, so the picker cycles through the
# standard five-level scale without an override.
#
# GLM-5.3-Flash always thinks — the announcement notes its
# thinking mode "is always on (disabled not supported)" — so
# the effort picker only changes depth, never turns it off.
type = "zhipu"
endpoint_url = "https://open.bigmodel.cn/api/coding/paas/v4"

# === GLM-5.3 — flagship, 1M context, text-only ===
# Per the GLM-5.3 model page
# (https://docs.bigmodel.cn/cn/guide/models/text/glm-5.3),
# GLM-5.3 is Zhipu's latest flagship, built on the *same base*
# as GLM-5.2 (1M context / 128K out) with a far larger
# long-horizon post-training scale; on Z.ai Code Bench it
# scores +50% over GLM-5.2. GLM Coding Plan has rolled it out
# to all tiers (Max & Pro & Lite). Text-only with thinking
# support. Claude Code users append `[1m]` (e.g. `glm-5.3[1m]`)
# to opt into 1M on the Anthropic-compatible endpoint, but on
# the OpenAI-compatible endpoint the API serves 1M context
# automatically.
[[models]]
id = "glm-5.3"
name = "GLM-5.3"
context_size = 1048576
image_support = false
max_tokens = 131072
thinking = true
thinking_budget = 10000
reasoning_effort = "max"
temperature = 0
stream_lerp = true

# === GLM-5.3-Flash — multimodal, 1M context, always-on thinking ===
# Per the Coding Plan switch guide
# (https://docs.bigmodel.cn/cn/coding-plan/latest-model) and
# the release notes
# (https://docs.bigmodel.cn/cn/update/new-releases):
#   * natively multimodal — understands images/video, supports
#     GUI-agent workflows (the switch guide tells Cline users
#     to tick "Support Images" for this model);
#   * 1M context with native function calling; auto-compress
#     window / context-window size 1000000 per the guide —
#     same convention as GLM-5.3/5.2 above, so 2^20 here;
#   * thinking is always on (not disable-able); effort still
#     cycles low/high/max per the guide's effort table;
#   * max output is not published for the Flash variant —
#     128K is used, matching every other GLM-5.x text model
#     (5.3 / 5.2 / 5.1 / 5-Turbo all document 128K out);
#   * credit cost ~1/3 of GLM-5.3 (deduction factors
#     2.3/0.56/8 vs 6.9/1.7/24 per the plan overview).
[[models]]
id = "glm-5.3-flash"
name = "GLM-5.3-Flash"
context_size = 1048576
image_support = true
max_tokens = 131072
thinking = true
thinking_budget = 10000
reasoning_effort = "max"
temperature = 0
stream_lerp = true
