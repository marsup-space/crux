# MiniMax provider configuration
# Filename serves as the provider name: "minimax"
# Anthropic-compatible API: https://api.minimaxi.com/anthropic
# OpenAI-compatible API: https://api.minimaxi.com/v1
#
# The custom `type = "minimax"` value is registered in
# `llm_provider.dart`'s resolveProvider() — it dispatches to a MiniMax-
# specific LlmProvider that extends AnthropicCompatibleProvider with:
#   - normal effort: thinking: {"type": "adaptive"} (model decides)
#   - high/max effort: thinking: {"type": "enabled", "budget_tokens": N}
#   - auth: Bearer token instead of x-api-key

type = "minimax"
endpoint_url = "https://api.minimaxi.com/anthropic/v1"

[[models]]
id = "MiniMax-M3"
name = "MiniMax M3"
context_size = 1000000
image_support = true
max_tokens = 131072
thinking = true
thinking_budget = 10000
temperature = 0
stream_lerp = true

# Model-specific system prompt addition. Renders as a separate
# layer in the system prompt, after the universal layer and before
# project notes / env meta. Effective only for this model; the
# other MiniMax models below inherit the provider-level value
# (none defined here).
#
# NOTE: M3's `normal` reasoning effort uses `thinking: {type:
# "adaptive"}` with no budget_tokens (see minimax_provider.dart).
# This is the *only* knob that influences how much the model
# deliberates on `normal` — so the wording here matters. Keep
# it specific and quantified; vague "avoid ..." phrasing has
# been observed to be ignored.
system_prompt_addition = """
## Thinking style (M3, normal effort)

M3 uses adaptive thinking — the model decides how much to
deliberate. The goal is **no fluff, not no depth**: cut the
obvious, keep the reasoning that actually helps.

- **Trivial turns** (greetings, yes/no, one-line replies,
  short acknowledgements): keep thinking minimal or skip it
  entirely — just answer.
- **Normal work** (the usual case): prefer a few sentences or
  a short bullet list. Skip the parts that don't add value:
  don't restate the user's request, don't enumerate steps
  that are obvious from the task, don't write a "plan" before
  every tool call.
- **Hard problems** (multi-step debugging, design tradeoffs,
  unfamiliar code, ambiguous requirements): take the
  thinking room you actually need. There's no word cap here
  — depth is welcome, just keep it on the parts that pay
  for themselves.

The think block is your scratch space, not the user's prose.
Write less in the think block and more in the final answer.

## Ambiguity

When the user's request is ambiguous and you can't reasonably
infer intent, ask one short clarifying question. The
exception: if the user explicitly asks for autonomous work,
proceed and surface the decisions you made in the final reply.
"""

[models.reasoning_labels]
low = "disabled"
normal = "adaptive"
high = "disabled"
max = "disabled"

[[models]]
id = "MiniMax-M2.7"
name = "MiniMax M2.7"
context_size = 204800
max_tokens = 65536
thinking = true
thinking_budget = 10000
temperature = 0
stream_lerp = true

[[models]]
id = "MiniMax-M2.7-highspeed"
name = "MiniMax M2.7 Highspeed"
context_size = 204800
max_tokens = 65536
thinking = true
thinking_budget = 10000
temperature = 0
stream_lerp = true
