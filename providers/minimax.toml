# MiniMax provider configuration
# Filename serves as the provider name: "minimax"
# Anthropic-compatible API: https://api.minimaxi.com/anthropic
# OpenAI-compatible API: https://api.minimaxi.com/v1
#
# The custom `type = "minimax"` value is registered in
# `llm_provider.dart`'s resolveProvider() — it dispatches to a MiniMax-
# specific LlmProvider that extends AnthropicCompatibleProvider with:
#   - normal effort: thinking: {"type": "adaptive"} (model decides)
#   - high/max effort: thinking: {"type": "enabled", "budget_tokens": N}
#   - auth: Bearer token instead of x-api-key

type = "minimax"
endpoint_url = "https://api.minimaxi.com/anthropic/v1"

[[models]]
id = "MiniMax-M3"
name = "MiniMax M3"
context_size = 1000000
image_support = true
max_tokens = 131072
thinking = true
thinking_budget = 10000
temperature = 0
stream_lerp = true

[models.reasoning_labels]
low = "disabled"
normal = "adaptive"
high = "disabled"
max = "disabled"

[[models]]
id = "MiniMax-M2.7"
name = "MiniMax M2.7"
context_size = 204800
max_tokens = 65536
thinking = true
thinking_budget = 10000
temperature = 0
stream_lerp = true

[[models]]
id = "MiniMax-M2.7-highspeed"
name = "MiniMax M2.7 Highspeed"
context_size = 204800
max_tokens = 65536
thinking = true
thinking_budget = 10000
temperature = 0
stream_lerp = true
