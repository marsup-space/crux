# MiniMax provider configuration
# Filename serves as the provider name: "minimax"
# Anthropic-compatible API: https://api.minimaxi.com/anthropic
# OpenAI-compatible API: https://api.minimaxi.com/v1
#
# The custom `type = "minimax"` value is registered in
# `llm_provider.dart`'s resolveProvider() — it dispatches to a MiniMax-
# specific LlmProvider that extends AnthropicCompatibleProvider with:
#   - normal effort: thinking: {"type": "adaptive"} (model decides)
#   - high/max effort: thinking: {"type": "enabled", "budget_tokens": N}
#   - auth: Bearer token instead of x-api-key

type = "minimax"
endpoint_url = "https://api.minimaxi.com/anthropic/v1"

[[models]]
id = "MiniMax-M3"
name = "MiniMax M3"
context_size = 1000000
image_support = true
max_tokens = 131072
thinking = true
thinking_budget = 10000
temperature = 0
stream_lerp = true

# Model-specific system prompt addition. Renders as a separate
# layer in the system prompt, after the universal layer and before
# project notes / env meta. Effective only for this model; the
# other MiniMax models below inherit the provider-level value
# (none defined here).
system_prompt_addition = """
Avoid thinking for too long. When the user's request is
ambiguous or you need a decision to proceed, ask the user for
clarification rather than guessing. The exception: if the
user explicitly asks you to work autonomously, then proceed
without asking and surface decisions in your final reply.
"""

[models.reasoning_labels]
low = "disabled"
normal = "adaptive"
high = "disabled"
max = "disabled"

[[models]]
id = "MiniMax-M2.7"
name = "MiniMax M2.7"
context_size = 204800
max_tokens = 65536
thinking = true
thinking_budget = 10000
temperature = 0
stream_lerp = true

[[models]]
id = "MiniMax-M2.7-highspeed"
name = "MiniMax M2.7 Highspeed"
context_size = 204800
max_tokens = 65536
thinking = true
thinking_budget = 10000
temperature = 0
stream_lerp = true
