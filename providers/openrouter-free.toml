# OpenRouter Free provider configuration
# Filename serves as the provider name: "openrouter-free"
# OpenAI-compatible API: https://openrouter.ai/api/v1
#
# Zero-cost access to OpenRouter's free tier — stealth preview models
# (stealth/*) and the :free variants of open-weight models, plus the
# openrouter/free auto-router. All models here bill $0.00 prompt and
# completion tokens.
#
# Get an API key at https://openrouter.ai/keys (free; no payment method
# needed for $0 models).
#
# Caveats of the free tier (see https://openrouter.ai/docs/faq):
#   - Rate limits: ~50 requests/day for accounts that have never
#     purchased credits; 1000/day once you've bought ≥10 credits.
#   - Free-model prompts/completions may be logged and used for
#     training by the upstream provider. Stealth models are run by an
#     anonymous third party under OpenRouter's Stealth Model Terms.
#   - Stealth models are previews: they appear, get renamed, and
#     disappear without notice. If a model below 404s, check
#     https://openrouter.ai/api/v1/models for the current free set.
#
# Reasoning on the wire
# ---------------------
# OpenRouter's canonical knob is a `reasoning: {effort: ...}` object,
# but it also accepts OpenAI's flat `reasoning_effort` (both are listed
# in each model's supported_parameters), which is exactly what Crux's
# generic openai_compatible provider sends — so no custom provider
# class is needed.
#
# Union Alpha currently accepts text and image input, supports tools,
# and does not expose a reasoning-effort control. Keep thinking disabled
# so Crux does not send an unsupported reasoning parameter.

type = "openai_compatible"
endpoint_url = "https://openrouter.ai/api/v1"

# Free tier is shared and rate-limited, but the cap still has to fit
# real agentic work: large-file refactors burn rounds fast (a single
# read-before-write guard block on a 2000-line file costs one round,
# and a split-into-commits task runs dozens of edit/verify cycles).
# 100 keeps a runaway loop bounded while letting those tasks finish
# in one turn instead of stopping at the old 50 with "send another
# message to continue".
default_max_rounds = 100

# Free tier is oversubscribed and flaky: a stalled stream is far more
# likely a dropped upstream than a slow one. Fail fast (45s of
# silence) so the auto-retry loop kicks in sooner instead of sitting
# on a dead connection for the 120s default. Provider-level, so
# `/provider openrouter-free sync` preserves it.
stream_idle_timeout_ms = 45000

# Stealth previews fail often and randomly — a request that 502s or
# dies mid-handshake usually succeeds on a later try. Give this
# provider an aggressive retry budget: up to 12 automatic retries
# (13 total attempts) with a fast backoff base. The ladder is
# 0.25s → 0.5s → 1s → 2s → 4s → 8s → 16s → 30s → 30s …, so the worst
# case spends ~92s waiting before giving up — long enough to ride out
# most free-tier turbulence without hanging the turn forever.
# Provider-level, preserved by sync.
max_retries = 12
retry_base_delay_ms = 250

# The killer failure mode on this tier: the request dies in an
# upstream queue, but OpenRouter keeps the TCP connection warm with
# periodic `: OPENROUTER PROCESSING` SSE comment keepalives. Those
# bytes reset the byte-level watchdog above forever, so a dead
# request can sit "streaming" for many minutes without tripping it.
# This watchdog only counts *parsed data events* — comments don't
# reset it — so 60s of zero real output kills the attempt and hands
# control to the retry loop. 60s is comfortably longer than any
# legitimate quiet gap a healthy stream produces here.
data_idle_timeout_ms = 60000

# === Stealth: Union Alpha — free multimodal coding model ===
# 256K context, image input, tool support, no reasoning-effort control.
[[models]]
id = "stealth/union-alpha"
name = "Union Alpha (stealth, free)"
context_size = 262144
image_support = true
thinking = false
reasoning_effort = "none"
max_tokens = 131072
expiration_date = "2098-12-31"
temperature = 0

# === NVIDIA Nemotron 3 Ultra — strongest free open-weight model ===
# 550B total / 12B active MoE, 1M context, reasoning high|medium.
# The best non-stealth workhorse in the free pool.
[[models]]
id = "nvidia/nemotron-3-ultra-550b-a55b:free"
name = "Nemotron 3 Ultra (free)"
context_size = 1000000
image_support = false
thinking = true
reasoning_effort = "high"
temperature = 0

# === NVIDIA Nemotron 3.5 Lightning — fast, no reasoning ===
# 1M context, fills the quick-question slot when Union Alpha's larger
# multimodal context is unnecessary.
# Note (smoke-tested 2026-08): the model still emits reasoning tokens
# in responses even with thinking disabled — upstream exposes no knob
# to turn them off. Harmless; Crux just renders a thinking block.
[[models]]
id = "nvidia/nemotron-3.5-lightning:free"
name = "Nemotron 3.5 Lightning (free)"
context_size = 1000000
image_support = false
thinking = false
reasoning_effort = "none"
temperature = 0
stream_lerp = true

# === Free Models Router — random pick from the free pool ===
# No reasoning guarantees (router omits the reasoning field), 200K
# context ceiling, image input depending on the chosen model.
# Reasoning-effort controls are disabled: the underlying model is
# chosen per-request, so any effort we send may be meaningless.
[[models]]
id = "openrouter/free"
name = "Free Models Router"
context_size = 200000
image_support = true
thinking = false
reasoning_effort = "none"
temperature = 0
