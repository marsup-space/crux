# DeepSeek provider configuration
# Filename serves as the provider name: "deepseek"
# OpenAI-compatible API: https://api.deepseek.com
# Anthropic-compatible API: https://api.deepseek.com/anthropic
#
# The custom `type = "deepseek"` value is registered in
# `llm_provider.dart`'s resolveProvider() — it dispatches to a DeepSeek-
# specific LlmProvider that enforces DeepSeek's actual reasoning effort
# semantics (the API only truly supports `high` and `max`; `low` and
# `medium` are SDK-compatibility aliases that both resolve to `high`).

type = "deepseek"
endpoint_url = "https://api.deepseek.com"

# DeepSeek API only supports two real reasoning efforts: high and max.
# low and medium are compatibility aliases that both resolve to high
# (see https://api-docs.deepseek.com/guides/thinking_mode). Hide them
# so the UI only exposes the three meaningful choices.
[reasoning_labels]
low = "disabled"
normal = "disabled"

[[models]]
id = "deepseek-v4-flash"
name = "DeepSeek V4 Flash"
context_size = 1048576
reasoning_effort = "high"
thinking = true
temperature = 0

[[models]]
id = "deepseek-v4-pro"
name = "DeepSeek V4 Pro"
context_size = 1048576
reasoning_effort = "high"
thinking = true
temperature = 0
