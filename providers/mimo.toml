# Xiaomi MiMo provider configuration
# Filename serves as the provider name: "mimo"
# OpenAI-compatible API: https://api.xiaomimimo.com/v1
#
# The custom `type = "mimo"` value is registered in
# `llm_provider.dart`'s resolveProvider() — it dispatches to a
# MiMo-specific LlmProvider that:
#   - extends OpenAICompatibleProvider (OpenAI Chat Completions
#     wire shape, Bearer auth, stream parsing inherited);
#   - removes the spurious `reasoning_effort` field (MiMo only
#     understands the binary `thinking.type: enabled/disabled`
#     knob, not OpenAI's reasoning-effort scale);
#   - pins `temperature: 1.0` and `top_p: 0.95` while thinking is
#     enabled, because MiMo's docs state that v2.5/v2.5-pro ignore
#     custom values in thinking mode and silently use these
#     recommended defaults.
#
# Models
# ------
# Per https://mimo.mi.com/docs/en-US/updates/model, the MiMo-V2.6
# series (released 2026-09-22, blog: https://mimo.xiaomi.com/mimo-v2-6)
# is the current flagship lineup, and all three entries below are
# natively multimodal per the official model pages:
#
#   * mimo-v2.6-pro            — 1M context, 128K max output,
#                                text/image/video/audio input
#                                (https://mimo.mi.com/models/mimo-v2.6-pro)
#   * mimo-v2.6-flash          — 1M context, 128K max output,
#                                text/image/video/audio input
#                                (https://mimo.mi.com/models/mimo-v2.6-flash)
#   * mimo-v2.6-pro-ultraspeed — up to 20x the output speed of
#                                mimo-v2.6-pro, 1M context, 128K max
#                                output, text/image/video/audio input
#                                (https://mimo.mi.com/models/mimo-v2.6-pro-ultraspeed)
#
# The deprecated MiMo-V2.5 series was removed: per
# https://mimo.mi.com/docs/welcome, `mimo-v2.5-pro` and `mimo-v2.5`
# stop being served on 2026-10-21 10:00 (GMT+8) and are scheduled to
# be taken offline entirely; pricing for them is already officially
# deprecated. V2.5 call behavior during the transition (auto-redirect
# or hard stop) is not documented, so Crux lists only the real V2.6
# targets — same rationale as the zhipu.toml cleanup. `mimo-v2.5-asr`
# (speech-to-text) and the TTS models are not chat-completions models
# and stay out of this list.
#
# Reasoning
# ---------
# MiMo Chat Completions has no `reasoning_effort` knob — only the
# `thinking.type` binary toggle. The TOML reasoning labels collapse
# the five internal effort levels down to a binary [off, on] picker:
# `off` disables thinking, `max` enables it, and the middle levels
# are hidden.
#
# Stream lerping
# --------------
# MiMo streams fine-grained deltas; `stream_lerp = true` opts the
# chat executor into a 60Hz drain timer for smoother rendering.
#
# Balance display
# ---------------
# MiMo's inference API has NO key-authenticated balance endpoint.
# The official docs only document chat / responses / list-models /
# audio endpoints, and the DeepSeek-style balance paths
# (/v1/user/balance, /v1/dashboard/billing/*) all 404 on
# api.xiaomimimo.com. The balance is visible only in the web
# console (platform.xiaomimimo.com/#/console/balance), which is
# browser-session authenticated — not callable with the API key.
# No toolbar balance row is therefore rendered for this provider.

type = "mimo"
endpoint_url = "https://api.xiaomimimo.com/v1"

[reasoning_labels]
low = "disabled"
normal = "disabled"
high = "disabled"
max = "on"

# === mimo-v2.6-pro — flagship reasoning model ===
[[models]]
id = "mimo-v2.6-pro"
name = "MiMo V2.6 Pro"
context_size = 1048576
image_support = true
max_tokens = 131072
reasoning_effort = "max"
thinking = true
temperature = 1.0
stream_lerp = true

# === mimo-v2.6-flash — efficient omni-modal model ===
[[models]]
id = "mimo-v2.6-flash"
name = "MiMo V2.6 Flash"
context_size = 1048576
image_support = true
max_tokens = 131072
reasoning_effort = "max"
thinking = true
temperature = 1.0
stream_lerp = true

# === mimo-v2.6-pro-ultraspeed — 20x-speed flagship ===
[[models]]
id = "mimo-v2.6-pro-ultraspeed"
name = "MiMo V2.6 Pro UltraSpeed"
context_size = 1048576
image_support = true
max_tokens = 131072
reasoning_effort = "max"
thinking = true
temperature = 1.0
stream_lerp = true
