id = "comfy-sleep-watch"
title = "comfy sleep"
label = """
😴 sleep watcher · {state}
queue: {running} running / {pending} pending
hb {heartbeatAt@HH:MM}"""
refresh_ms = 5000

[status]
path = "/tmp/comfy-sleep-watch.json"
heartbeat_field = "heartbeatAt"
stale_after_seconds = 90

fallback_alive_text = "watching"
fallback_stale_text = "stale"
fallback_absent_text = "not running"

[[status.state_rules]]
when = { field = "state", equals = "watching" }
text = "watching"
color = "normal"

[[status.state_rules]]
when = { field = "state", equals = "suspending" }
text = "SUSPEND ARMED"
color = "warning"

[[status.state_rules]]
when = { field = "state", equals = "cancelled" }
text = "cancelled"
color = "dim"

[[status.state_rules]]
when = { field = "state", equals = "done" }
text = "suspended"
color = "dim"

[[status.state_rules]]
when = { field = "state", equals = "error" }
text = "suspend failed"
color = "error"

[[actions]]
label = "cancel sleep"
kind = "shell"
command = "touch /tmp/comfy-sleep-watch.cancel; pkill -f comfy-sleep-watch.sh; echo cancelled"
